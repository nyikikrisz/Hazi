<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza rendeles</title>
</head>

<body>
    <h2>Pizzarendelés</h2>

    <form action="rendeles.php" method="post">

        <fieldset>
            <legend>Kapcsolat</legend>
            <p>
                <label for="nev">Név *</label><br>
                <input type="text" id="nev" name="nev" required>
            </p>
            <p>
                <label for="tel">Telefon *</label><br>
                <input type="tel" id="tel" name="telefon" placeholder="+36 30 123 4567" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>A pizza</legend>
            <p>
                <label for="fajta">Fajta *</label>
                <select id="fajta" name="fajta" required>
                    <option value="">-- válassz --</option>
                    <option value="margherita">Margherita</option>
                    <option value="sonkas">Sonkás</option>
                    <option value="negysajtos">Négysajtos</option>
                    <option value="szalamis">Szalámis</option>
                    <option value="sonkas-sajtos">Sonkás-sajtos</option>
                    <option value="piadone">Piadone</option>
                    <option value="husimado">Húsimádó</option>
                </select>
            </p>

            <p><strong>Méret:</strong></p>
            <p>
                <input type="radio" id="m1" name="meret" value="26" checked>
                <label for="m1">26 cm</label>
                <input type="radio" id="m2" name="meret" value="32">
                <label for="m2">32 cm</label>
                <input type="radio" id="m3" name="meret" value="52">
                <label for="m2">52 cm</label>
            </p>

            <p><strong>Extra feltét:</strong></p>
            <p>
                <input type="checkbox" id="f1" name="extra" value="sajt">
                <label for="f1">Extra sajt</label>
                <input type="checkbox" id="f2" name="extra" value="gomba">
                <label for="f2">Gomba</label>
                <input type="checkbox" id="f3" name="extra" value="szosz">
                <label for="f3">Pizzaszósz (mellé)</label>
                <input type="checkbox" id="f4" name="extra" value="csipos">
                <label for="f4">Csípős</label>
            </p>

            <p>
                <label for="db">Darab *</label>
                <input type="number" id="db" name="darab" value="1" min="1" max="10" required>
            </p>
        </fieldset>

        <p>
            <label for="megj">Megjegyzés</label><br>
            <textarea id="megj" name="megjegyzes" rows="3" cols="34"></textarea>
        </p>
        <fieldset>
                <legend>Kedvezmény</legend>
            <p>
                <label for="kupon">kupon</label><br>
                <input type="text" maxlength="15" >
            </p>
        </fieldset>
        <p>
            <input type="checkbox" id="aszf" name="aszf" value="elfogadva" required>
            <label for="aszf">Elfogadom a feltételeket *</label>
        </p>
        
        <button type="submit">Megrendelem</button>
    </form>
</body>

</html>
